  <g fill="none" stroke="#3b6fd6" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 15.5" stroke-dashoffset="9">
    <path d="M70,108 A130,86 0 0,0 330,108"/>
    <path d="M56,146 A144,104 0 0,0 344,146"/>
    <path d="M44,186 A156,124 0 0,0 356,186"/>
    <path d="M34,228 A166,148 0 0,0 366,228"/>
