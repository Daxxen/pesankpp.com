      <circle cx="45" cy="10" r="7" fill="#3b6fd6"/>
      <circle cx="80" cy="45" r="7" fill="#3b6fd6"/>
      <circle cx="45" cy="80" r="7" fill="#3b6fd6"/>
      <circle cx="10" cy="45" r="7" fill="#3b6fd6"/>
    </symbol>
  </defs>

  <rect width="400" height="300" fill="#f7f8fa"/>
  <rect x="18" y="18" width="364" height="264" rx="6" fill="none" stroke="#c7d2e0" stroke-width="2"/>

  <!-- whiteboard wall with sticky notes -->
  <rect x="40" y="34" width="150" height="60" rx="2" fill="#ffffff" stroke="#c7d2e0" stroke-width="2"/>
  <rect x="52" y="46" width="20" height="20" rx="2" fill="#3b6fd6"/>
  <rect x="80" y="52" width="20" height="20" rx="2" fill="#7fa4e8"/>
  <rect x="108" y="44" width="20" height="20" rx="2" fill="#1e4a82"/>
  <rect x="136" y="56" width="20" height="20" rx="2" fill="#3b6fd6"/>
  <rect x="60" y="72" width="20" height="14" rx="2" fill="#a8c1ea"/>
  <rect x="100" y="74" width="20" height="14" rx="2" fill="#7fa4e8"/>

  <!-- door -->
  <rect x="358" y="24" width="6" height="34" fill="#94a3b8"/>
  <path d="M364,58 A34,34 0 0,0 364,24" fill="none" stroke="#c7d2e0" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- three round table pods for small-group discussion -->
  <use href="#pod" x="45" y="140" width="90" height="90"/>
  <use href="#pod" x="270" y="145" width="90" height="90"/>
  <use href="#pod" x="166" y="190" width="90" height="90"/>
