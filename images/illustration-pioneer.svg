<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <symbol id="chair-p" viewBox="0 0 14 10">
      <rect x="0" y="0" width="14" height="10" rx="2" fill="#3b6fd6"/>
    </symbol>
  </defs>

  <rect width="400" height="300" fill="#f7f8fa"/>
  <rect x="18" y="18" width="364" height="264" rx="6" fill="none" stroke="#c7d2e0" stroke-width="2"/>

  <!-- windows on right wall -->
  <rect x="376" y="70" width="6" height="34" fill="#dce6f5"/>
  <rect x="376" y="150" width="6" height="34" fill="#dce6f5"/>
  <rect x="376" y="230" width="6" height="34" fill="#dce6f5"/>

  <!-- front screen -->
  <rect x="145" y="34" width="110" height="16" rx="2" fill="#11294a"/>
  <rect x="197" y="50" width="6" height="10" fill="#94a3b8"/>

  <!-- door -->
  <rect x="30" y="24" width="6" height="34" fill="#94a3b8"/>
  <path d="M30,58 A34,34 0 0,1 30,24" fill="none" stroke="#c7d2e0" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- U-shaped table, open end toward the screen -->
  <path d="M110,100 L110,236 L290,236 L290,100" fill="none" stroke="#1e4a82" stroke-width="16" stroke-linejoin="round"/>

  <!-- chairs along the outer edge of the U -->
  <g>
    <use href="#chair-p" x="86" y="112" width="16" height="12"/>
    <use href="#chair-p" x="86" y="148" width="16" height="12"/>
    <use href="#chair-p" x="86" y="184" width="16" height="12"/>
    <use href="#chair-p" x="86" y="216" width="16" height="12"/>

    <use href="#chair-p" x="298" y="112" width="16" height="12"/>
    <use href="#chair-p" x="298" y="148" width="16" height="12"/>
    <use href="#chair-p" x="298" y="184" width="16" height="12"/>
    <use href="#chair-p" x="298" y="216" width="16" height="12"/>

    <use href="#chair-p" x="140" y="246" width="16" height="14"/>
    <use href="#chair-p" x="178" y="246" width="16" height="14"/>
    <use href="#chair-p" x="216" y="246" width="16" height="14"/>
    <use href="#chair-p" x="254" y="246" width="16" height="14"/>
  </g>
</svg>
